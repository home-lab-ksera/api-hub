name: ci

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: api_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Test durable notification recovery
        env:
          TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/api_hub_test
        run: cargo test --locked --test notifications -- --ignored

      - name: Check bounded streaming memory with isolated HTTP fixtures
        run: |
          cargo build --locked --example http_fixture
          python3 scripts/check-stream-memory.py target/debug/examples/http_fixture
