# GitHub Actions workflow for api-hub
# Auto-generated by add-runner.sh (公式ARC対応版) - latest運用

name: Build and Push to Harbor - api-hub

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: harbor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recovery-tests:
    uses: ./.github/workflows/ci.yml

  build-image:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        echo "=== Build image on GitHub-hosted runner ==="
        docker build -t api-hub:ci .

    - name: Export Docker image tar
      run: |
        docker save api-hub:ci | gzip > /tmp/api-hub-image.tar.gz

    - name: Upload image artifact
      uses: actions/upload-artifact@v4
      with:
        name: api-hub-image
        path: /tmp/api-hub-image.tar.gz
        retention-days: 1

  # OIDC 接続の移行検証。通常公開とは別タグで同じイメージを検証する。
  test-oidc-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      HARBOR_URL: harbor.internal.qroksera.com
      HARBOR_PROJECT: sandbox

    steps:
    - name: Check required secrets are available
      env:
        TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
        HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
        HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
      run: |
        set -euo pipefail
        for name in TS_OAUTH_CLIENT_ID TS_AUDIENCE HARBOR_USERNAME HARBOR_PASSWORD; do
          if [[ -z "${!name}" ]]; then
            echo "::error::Required secret is unavailable: $name"
            exit 1
          fi
        done

    - name: Download image artifact
      uses: actions/download-artifact@v4
      with:
        name: api-hub-image
        path: ${{ runner.temp }}/oidc-image

    - name: Connect to Tailscale with GitHub OIDC
      uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        audience: ${{ secrets.TS_AUDIENCE }}
        tags: tag:ci-harbor
        args: --accept-routes --accept-dns=false
        hostname: api-hub-ci-${{ github.run_id }}-${{ github.run_attempt }}
        retry: '1'

    - name: Resolve Harbor and verify HTTPS connectivity
      run: |
        set -euo pipefail
        printf '192.168.122.100 %s\n' "$HARBOR_URL" | sudo tee -a /etc/hosts > /dev/null
        # 新しい端末の経路・アクセス設定が反映されるまで待つ。
        for attempt in {1..6}; do
          status=$(curl --silent --show-error --connect-timeout 10 --max-time 15 \
            --output /dev/null --write-out '%{http_code}' "https://$HARBOR_URL/v2/") || status=000
          if [[ "$status" == 200 || "$status" == 401 ]]; then
            echo "Harbor registry reached over verified HTTPS (HTTP $status)."
            exit 0
          fi
          echo "Harbor not ready (HTTP $status, attempt $attempt/6)."
          sleep 5
        done
        echo "::error::Cannot reach Harbor over Tailscale. Check subnet route approval and grants."
        exit 1

    - name: Push and verify OIDC test image
      env:
        HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
        HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
      run: |
        set -euo pipefail
        umask 077
        export DOCKER_CONFIG="$RUNNER_TEMP/oidc-harbor-auth"
        mkdir -p "$DOCKER_CONFIG"
        printf '%s' "$HARBOR_PASSWORD" | docker login "$HARBOR_URL" \
          --username "$HARBOR_USERNAME" --password-stdin
        gunzip -c "$RUNNER_TEMP/oidc-image/api-hub-image.tar.gz" | docker load
        IMAGE="$HARBOR_URL/$HARBOR_PROJECT/api-hub:oidc-test-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        docker tag api-hub:ci "$IMAGE"
        docker push "$IMAGE"
        export EXPECTED_CONFIG_DIGEST
        EXPECTED_CONFIG_DIGEST=$(docker image inspect api-hub:ci --format '{{.Id}}')
        docker manifest inspect "$IMAGE" > "$RUNNER_TEMP/oidc-image/manifest.json"
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path

        manifest = json.loads((Path(os.environ['RUNNER_TEMP']) / 'oidc-image/manifest.json').read_text())
        expected = os.environ['EXPECTED_CONFIG_DIGEST']
        actual = manifest['config']['digest']
        if actual != expected:
            raise SystemExit(f'Image config digest mismatch: {actual} != {expected}')
        print(f'Harbor image verified: {actual}')
        PY
        {
          echo '### Harbor OIDC push verified'
          printf '\nImage: `%s`\n' "$IMAGE"
          printf '\nVerified image config digest: `%s`\n' "$EXPECTED_CONFIG_DIGEST"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Cleanup OIDC test credentials and artifact
      if: always()
      run: rm -rf "$RUNNER_TEMP/oidc-harbor-auth" "$RUNNER_TEMP/oidc-image"

  push-image:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [build-image, recovery-tests]
    runs-on: harbor-publish-runners
    concurrency:
      group: harbor-publish-${{ github.repository }}
      cancel-in-progress: false

    steps:
    - name: Download image artifact
      uses: actions/download-artifact@v4
      with:
        name: api-hub-image
        path: /tmp

    - name: Install crane (verified release)
      shell: bash
      run: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64) ARCH=x86_64; SHA256=0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0 ;;
          aarch64) ARCH=arm64; SHA256=898c0cff975f898a33e8c4580bdafb0e7c02c7faa33374e946762f97c4ab7110 ;;
          *) echo "Unsupported architecture" >&2; exit 1 ;;
        esac
        mkdir -p "$RUNNER_TEMP/crane-bin"
        curl --fail --silent --show-error --location \
          "https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_$ARCH.tar.gz" \
          -o "$RUNNER_TEMP/crane.tar.gz"
        echo "$SHA256  $RUNNER_TEMP/crane.tar.gz" | sha256sum --check
        tar -xzf "$RUNNER_TEMP/crane.tar.gz" -C "$RUNNER_TEMP/crane-bin" crane

    - name: Push versioned image without Docker
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        export DOCKER_CONFIG="$RUNNER_TEMP/harbor-auth"
        mkdir -p "$DOCKER_CONFIG"
        CRANE="$RUNNER_TEMP/crane-bin/crane"
        HARBOR_URL=$(cat /etc/harbor-auth/HARBOR_URL)
        HARBOR_PROJECT=$(cat /etc/harbor-auth/HARBOR_PROJECT)
        HARBOR_USERNAME=$(cat /etc/harbor-auth/HARBOR_USERNAME)
        "$CRANE" auth login "$HARBOR_URL" --username "$HARBOR_USERNAME" \
          --password-stdin < /etc/harbor-auth/HARBOR_PASSWORD
        gunzip -c /tmp/api-hub-image.tar.gz > "$RUNNER_TEMP/image.tar"
        VERSION="build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_SHA"
        "$CRANE" push "$RUNNER_TEMP/image.tar" "$HARBOR_URL/$HARBOR_PROJECT/api-hub:$VERSION"

    - name: Check publication is still the default branch head
      id: publication
      uses: actions/github-script@v7
      with:
        result-encoding: string
        script: |
          const {data: repo} = await github.rest.repos.get(context.repo);
          if (context.ref !== `refs/heads/${repo.default_branch}`) return false;
          const {data: head} = await github.rest.repos.getCommit({...context.repo, ref: repo.default_branch});
          return head.sha === context.sha;

    - name: Promote current build to latest
      if: ${{ steps.publication.outputs.result == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        export DOCKER_CONFIG="$RUNNER_TEMP/harbor-auth"
        HARBOR_URL=$(cat /etc/harbor-auth/HARBOR_URL)
        HARBOR_PROJECT=$(cat /etc/harbor-auth/HARBOR_PROJECT)
        VERSION="build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_SHA"
        "$RUNNER_TEMP/crane-bin/crane" tag "$HARBOR_URL/$HARBOR_PROJECT/api-hub:$VERSION" latest

    - name: Cleanup
      if: always()
      shell: bash
      run: |
        rm -rf "$RUNNER_TEMP/harbor-auth" "$RUNNER_TEMP/crane-bin"
        rm -f "$RUNNER_TEMP/crane.tar.gz" "$RUNNER_TEMP/image.tar" /tmp/api-hub-image.tar.gz
