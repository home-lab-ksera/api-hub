# GitHub Actions workflow for api-hub
# GitHub-hosted runner + Tailscale OIDC - latest運用

name: Build and Push to Harbor - api-hub

on:
  # 手動実行はテストとビルドのみ。公開は main への push で実行する。
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: harbor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recovery-tests:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: recovery-tests
    uses: home-lab-ksera/home-lab-k8s/.github/workflows/publish-harbor.yml@main
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      image_name: api-hub
