[package]
name = "api-hub"
version = "0.1.0"
edition = "2024"
default-run = "api-hub"
rust-version = "1.88"

# ARCとQEMU環境互換性のためのターゲット設定
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

# CPU feature互換性確保 - 環境変数RUSTFLAGSを使用
# [target.x86_64-unknown-linux-gnu]
# rustflags = ["-C", "target-cpu=x86-64", "-C", "target-feature=-aes,-avx,-avx2"]

[dependencies]
axum = "0.8.8"
http-body-util = "0.1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
base64 = "0.22.1"
nojson = "0.3.9"
shiguredo_http11 = "2026.1.1"
shiguredo_s3 = "2026.1.0-canary.0"
tokio = { version = "1.44.0", features = ["macros", "rt-multi-thread", "signal", "net", "io-util", "time", "fs", "sync"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", default-features = false, features = ["json", "env-filter", "fmt"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "json", "migrate", "macros"] }

[dev-dependencies]
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
proptest = "1.7.0"
tokio = { version = "1.44.0", features = ["time", "sync", "process"] }

[[bin]]
name = "api-hub"
path = "src/main.rs"
